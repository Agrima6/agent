databases:
  - name: workmate-iq-db
    plan: free
    databaseName: workmate_iq
    user: workmate_iq

services:
  # FastAPI service: HR console, candidate room page, all /v1/* API endpoints.
  - type: web
    name: workmate-iq-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: workmate-iq-db
          property: connectionString
      - key: API_BASE_URL
        sync: false  # set manually after first deploy to this service's own public URL
      - key: OPENAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: TTS_PROVIDER
        value: sarvam
      - key: TTS_VOICE
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: SARVAM_MODEL
        value: "bulbul:v3"
      - key: SARVAM_SPEAKER
        sync: false
      - key: SARVAM_LANGUAGE_CODE
        value: en-IN
      - key: SARVAM_PACE
        value: "1.0"
      - key: SARVAM_SAMPLE_RATE
        value: "22050"

  # LiveKit voice agent worker: connects to LiveKit Cloud and joins interview rooms. No public
  # URL of its own — needs a paid instance type since Render's free tier only runs web services
  # (things that answer HTTP requests); a background worker has nothing to answer, so free-tier
  # instances spin it down as "idle" almost immediately.
  - type: worker
    name: workmate-iq-agent
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python agent.py start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: workmate-iq-db
          property: connectionString
      - key: API_BASE_URL
        sync: false  # same value as workmate-iq-api's own public URL
      - key: OPENAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: TTS_PROVIDER
        value: sarvam
      - key: TTS_VOICE
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: SARVAM_MODEL
        value: "bulbul:v3"
      - key: SARVAM_SPEAKER
        sync: false
      - key: SARVAM_LANGUAGE_CODE
        value: en-IN
      - key: SARVAM_PACE
        value: "1.0"
      - key: SARVAM_SAMPLE_RATE
        value: "22050"
