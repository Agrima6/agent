databases:
  - name: workmate-iq-db
    plan: free
    databaseName: workmate_iq
    user: workmate_iq

services:
  # Single free web service running BOTH the FastAPI app (HR console, candidate room, API) AND
  # the LiveKit voice agent worker (spawned as a subprocess at startup via RUN_AGENT_INLINE).
  # Render's free tier only supports "web" services (things that bind to a port) — a separate
  # background worker needs a paid plan. Running the agent as a child process of the web
  # service keeps this entirely on the free tier, at the cost of both sharing one container's
  # resources and both going to sleep together after 15 min of no HTTP traffic (mitigate with
  # a free external uptime pinger such as UptimeRobot hitting "/" every 5 minutes).
  - type: web
    name: workmate-iq-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: RUN_AGENT_INLINE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: workmate-iq-db
          property: connectionString
      - key: API_BASE_URL
        sync: false  # set manually after first deploy to this service's own public URL
      - key: OPENAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: TTS_PROVIDER
        value: sarvam
      - key: TTS_VOICE
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: SARVAM_MODEL
        value: "bulbul:v3"
      - key: SARVAM_SPEAKER
        sync: false
      - key: SARVAM_LANGUAGE_CODE
        value: en-IN
      - key: SARVAM_PACE
        value: "1.0"
      - key: SARVAM_SAMPLE_RATE
        value: "22050"
